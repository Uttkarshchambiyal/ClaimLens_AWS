[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens-ai-agent"
version = "0.1.0"
description = "AI Claim-Review Assistant for ClaimLens powered by Strands Agents SDK and SageMaker AI"
authors = [{ name = "ClaimLens Team" }]
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "models*", "tools*", "retrieval*", "sessions*", "api*"]
