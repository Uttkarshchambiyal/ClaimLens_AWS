name: Verify ClaimLens
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_project.py
      - run: python -m pip_audit -r backend/requirements.txt && python -m pip_audit -r requirements-dev.txt
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claimlens-verification-results
          path: docs/verification-results.json
